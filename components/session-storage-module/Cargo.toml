[package]
name = "proteus-session-storage-module"
version = "0.1.0-alpha.3"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.proteus]
id = "session-storage"
implementation = "storage/session-storage"

[[bin]]
name = "proteus-session-storage-module"
path = "src/main.rs"
test = false
bench = false

[dependencies]
proteus-module-sdk = { workspace = true }
proteus-contracts = { workspace = true }
session-storage = { path = "../../storage/session-storage" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
