[workspace]
resolver = "2"
exclude = ["research/tool-output-artifacts"]
members = [
    "model/model-pack",
    "workflow/coding-workflow",
    "context/context-pack",
    "policy/policy-pack",
    "hook/hook-pack",
    "hook/codex-context-preparation",
    "hook/tool-selection-hook",
    "tool/file-tools",
    "tool/git-tools",
    "tool/shell-tool",
    "tool/plan-tool",
    "tool/direct-patch",
    "tool/codex-patch",
    "tool/rust-lsp",
    "tool/skill-pack",
    "context_provider/rg-search",
    "context_provider/memory-pack",
    "context_provider/sqlite-memory",
    "components/process-module",
]

[workspace.dependencies]
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "9a1d74170521cadf8ec7891aa3da1642279367b7" }
proteus-module-protocol = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "9a1d74170521cadf8ec7891aa3da1642279367b7" }
proteus-process-host = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "9a1d74170521cadf8ec7891aa3da1642279367b7" }
proteus-core = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "9a1d74170521cadf8ec7891aa3da1642279367b7" }

[profile.dev]
debug = "line-tables-only"
