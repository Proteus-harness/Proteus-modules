[workspace]
resolver = "2"
exclude = ["research/tool-output-artifacts"]
members = [
    "components/module-runtime",
    "components/model-pack-module",
    "components/coding-workflow-module",
    "components/context-pack-module",
    "components/policy-pack-module",
    "components/hook-pack-module",
    "components/codex-context-preparation-module",
    "components/tool-selection-hook-module",
    "components/file-tools-module",
    "components/git-tools-module",
    "components/shell-tool-module",
    "components/plan-tool-module",
    "components/direct-patch-module",
    "components/codex-patch-module",
    "components/rust-lsp-module",
    "components/skill-pack-module",
    "components/rg-search-module",
    "components/memory-pack-module",
    "components/sqlite-memory-module",
    "model/model-pack",
    "workflow/coding-workflow",
    "context/context-pack",
    "policy/policy-pack",
    "hook/hook-pack",
    "hook/codex-context-preparation",
    "hook/tool-selection-hook",
    "tool/file-tools",
    "tool/git-tools",
    "tool/shell-tool",
    "tool/plan-tool",
    "tool/direct-patch",
    "tool/codex-patch",
    "tool/rust-lsp",
    "tool/skill-pack",
    "context_provider/rg-search",
    "context_provider/memory-pack",
    "context_provider/sqlite-memory",
    "components/process-module",
]

default-members = [
    "components/model-pack-module",
    "components/coding-workflow-module",
    "components/context-pack-module",
    "components/policy-pack-module",
    "components/hook-pack-module",
    "components/codex-context-preparation-module",
    "components/tool-selection-hook-module",
    "components/file-tools-module",
    "components/git-tools-module",
    "components/shell-tool-module",
    "components/plan-tool-module",
    "components/direct-patch-module",
    "components/codex-patch-module",
    "components/rust-lsp-module",
    "components/skill-pack-module",
    "components/rg-search-module",
    "components/memory-pack-module",
    "components/sqlite-memory-module",
]

[workspace.dependencies]
proteus-module-sdk = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "c70b98a3dddd70ecb263450f86454c6bbc11e757" }
proteus-contracts = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "c70b98a3dddd70ecb263450f86454c6bbc11e757" }
proteus-module-protocol = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "c70b98a3dddd70ecb263450f86454c6bbc11e757" }
proteus-process-host = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "c70b98a3dddd70ecb263450f86454c6bbc11e757" }
proteus-core = { git = "https://github.com/Proteus-harness/Proteus-core.git", rev = "c70b98a3dddd70ecb263450f86454c6bbc11e757" }

[profile.dev]
debug = "line-tables-only"
