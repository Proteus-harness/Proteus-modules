[package]
name = "sqlite-memory"
version = "0.1.0-alpha.2"
edition = "2024"
publish = false

[dependencies]
proteus-contracts = { workspace = true }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
