[package]
name = "tool-output-artifacts"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
proteus-contracts = { git = "https://github.com/Qweasd123tg/Proteus-harness.git", rev = "d9fe8c75f502d8086aaa28cfd4e46bade00db2ad" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"
